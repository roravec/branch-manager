name: Build and Deploy to FTP

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: |
          if [ -f package-lock.json ]; then
            echo "using npm ci"
            npm ci
          else
            echo "using npm install"
            npm install
          fi

      - name: Build Vue project
        working-directory: src/frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vue-build
          path: src/frontend/dist/**
          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if FTP_PASS is set
        run: |
          if [ -z "${{ secrets.FTP_PASS }}" ]; then
            echo "FTP_PASS is empty or not set"
            exit 1
          else
            echo "FTP_PASS is set"
          fi

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: vue-build
          path: vue-build-temp

      - name: Move build files to dist
        run: |
          mkdir -p src/frontend/dist
          rm -rf src/frontend/dist/*
          shopt -s dotglob
          if [ -n "$(ls -A vue-build-temp 2>/dev/null || true)" ]; then
            cp -a vue-build-temp/* src/frontend/dist/
            ls -l src/frontend/dist
          else
            ls -R vue-build-temp || true
            exit 1
          fi

          
      - name: Upload submodule files - API root application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER_API }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          timeout: 120000
          local-dir: WebApplication/src/
          server-dir: /

      - name: Upload src/backend/ files to FTP (Backend)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER_API }}
          password: ${{ secrets.FTP_PASS }}
          timeout: 120000
          protocol: ftp
          local-dir: src/backend/
          server-dir: applications/branchmanager/

      - name: Upload src/dist/ files to FTP (Frontend)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          timeout: 120000
          protocol: ftp
          local-dir: src/frontend/dist/
          server-dir: /
